name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/GhostLang.sln

      - name: Build
        run: dotnet build src/GhostLang.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/GhostLang.sln -c Release --no-build --verbosity minimal